name: Web build

# On main this runs through itch.yml, which deploys the build it uploads.
on:
  push:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same pygbag version as the local install, so CI builds what `pygbag game` builds.
      - name: Install dependencies
        run: |
          pip install pygbag==0.9.3 pygame-ce==2.5.7 pytest==9.2.0 playwright==1.64.1
          playwright install --with-deps chromium

      - name: Build web version
        run: pygbag --build game

      - name: Test the build in a browser
        run: pytest tests/web_build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: game/build/web
          if-no-files-found: error
