name: Tests

# On main this runs through itch.yml, which needs it to pass before deploying.
on:
  push:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 is what pygbag runs in the browser. Linux also catches file name case mistakes
      # that macOS lets through.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pygame-ce==2.5.7 pytest==9.2.0

      - name: Run tests
        run: pytest
